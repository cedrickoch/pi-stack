services:
  litellm:
    # main-stable floatet -> auf konkrete Version gepinnt.
    # Empfohlen: zusaetzlich per Digest pinnen:
    #   docker buildx imagetools inspect ghcr.io/berriai/litellm:main-v1.55.8
    #   -> image: ghcr.io/berriai/litellm:main-v1.55.8@sha256:<DIGEST>
    image: ghcr.io/berriai/litellm:v1.108.9
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    environment:
      - LITELLM_MASTER_KEY
      - SWISSCOM_MYAI_API_KEY
      - NUMES_API_KEY
      # - OPENAI_API_KEY
      # - ANTHROPIC_API_KEY
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"      # optional, nur für Tests vom Host aus
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5
    # --- Haertung: dieser Container hat Internet + alle Provider-Keys ---
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    read_only: true
    tmpfs:
      # NICHT /app als tmpfs mounten: /app enthaelt den Image-Inhalt
      # (docker/prod_entrypoint.sh, litellm-Paket). Ein tmpfs wuerde ihn verdecken.
      - /tmp
      - /root/.cache
      - /home/litellm/.cache
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pi:
    build:
      context: .
      dockerfile: Dockerfile.pi
    image: pi-sandbox
    depends_on:
      litellm:
        condition: service_healthy
      proxy:
        condition: service_started
    stdin_open: true
    tty: true
    working_dir: /workspace
    user: "1000:1000"
    environment:
      # virtueller Key (eingeschraenkt), NICHT der Master-Key -> siehe scripts/make-pi-key.sh
      # Bootstrap: solange kein VIRTUAL KEY existiert, faellt es auf den Master-Key
      # zurueck (sonst ist "up -d litellm" vor Key-Erzeugung nicht startbar).
      # Nach scripts/make-pi-key.sh + Eintrag in .env: docker compose up -d --force-recreate pi
      - LITELLM_PROXY_TOKEN=${LITELLM_PROXY_TOKEN:-${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY oder LITELLM_PROXY_TOKEN in .env setzen}}
      - HOME=/home/node
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - http_proxy=http://proxy:3128
      - https_proxy=http://proxy:3128
      # litellm MUSS am Proxy vorbei, sonst läuft der interne Traffic darüber:
      - NO_PROXY=litellm,localhost,127.0.0.1
      - no_proxy=litellm,localhost,127.0.0.1
      # Node.js (pi) beachtet Proxy-Variablen nicht von allein:
      - NODE_USE_ENV_PROXY=1
    volumes:
      - ${WORKSPACE:-.}:/workspace
      # pi-config liegt jetzt im Home des unprivilegierten Users
      - ./pi-config:/home/node/.pi/agent
    networks: [internal]            # kein Internet
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
      - /home/node/.npm
      - /home/node/.config
    pids_limit: 512
    mem_limit: 4g
    logging: *default-logging

  proxy:
    image: ubuntu/squid:6.6-24.04_edge   # konkrete Version pinnen, Tag ggf. anpassen
    restart: unless-stopped
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/allowed_domains.txt:/etc/squid/allowed_domains.txt:ro
    networks: [internal, egress]
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/spool/squid:uid=13,gid=13,mode=0755
      - /var/log/squid:uid=13,gid=13,mode=0755
      - /var/run:uid=13,gid=13,mode=0755
      - /tmp:mode=1777
    pids_limit: 128
    mem_limit: 512m
    logging: *default-logging


networks:
  internal:
    internal: true                  # keine Verbindung nach aussen
  egress: {}                        # normales Netz mit Internet, nur für LiteLLM
