model_list:
  - model_name: glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash          # "openai/" = OpenAI-kompatibler Endpunkt
      api_base: https://code.myai.swisscom.ch/v1
      api_key: os.environ/SWISSCOM_MYAI_API_KEY
      rpm: 120
      tpm: 400000

  - model_name: qwen3.5-397b-a17b
