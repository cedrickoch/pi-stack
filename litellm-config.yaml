  # Weitere Provider, Beispiel (Modellnamen anpassen):
  # - model_name: claude-sonnet
  #   litellm_params:
  #     model: anthropic/<modellname>
  #     api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true        # unbekannte Parameter weglassen statt Fehler
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  max_budget: 25           # globale Notbremse in USD (30d) - greift auch bei geleaktem Key
  budget_duration: 30d
  disable_admin_ui: true

